<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>GymLog — Registro de entrenamiento</title>
<link rel="manifest" href="./manifest.json">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117; --card:#161c26; --card2:#1d2531; --line:#28323f;
  --txt:#e8eef7; --muted:#8b98ab; --acc:#8bf14a; --acc2:#4dd6f0;
  --warn:#ffb020; --danger:#ff5d5d; --r:14px;
}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1100px 600px at 50% -25%, #17222f 0%, var(--bg) 62%) fixed;
  color:var(--txt); font-size:15px; line-height:1.45;
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh; padding-bottom:170px;
}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.lbl{color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.gap6{gap:6px}.gap8{gap:8px}.mt8{margin-top:8px}.mt12{margin-top:12px}
.hidden{display:none!important}

.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px 12px;
  background:linear-gradient(180deg,rgba(13,17,23,.96),rgba(13,17,23,.78));
  backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
}
.brand{font-weight:800;letter-spacing:.14em;font-size:15px;display:flex;align-items:baseline;gap:4px}
.brand b{color:var(--acc)}
.brand span{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0}
.topbar nav{display:flex;gap:6px}
.topbar nav button{
  background:transparent;border:1px solid var(--line);color:var(--muted);
  padding:7px 11px;border-radius:10px;font-size:12.5px;font-weight:600;cursor:pointer;
}
.topbar nav button.on{color:#0b1206;background:var(--acc);border-color:var(--acc)}

main{padding:16px;max-width:720px;margin:0 auto}
.section-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin:22px 0 10px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.empty{color:var(--muted);text-align:center;padding:34px 16px;font-size:14px}

.hero{
  background:linear-gradient(150deg,#1a2432,#141a23 60%);
  border:1px solid var(--line);border-radius:20px;padding:22px 18px;margin-bottom:8px;
  position:relative;overflow:hidden;
}
.hero::after{content:"";position:absolute;width:220px;height:220px;right:-90px;top:-90px;
  background:radial-gradient(circle,rgba(139,241,74,.18),transparent 70%);border-radius:50%}
.hero h1{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}
.hero p{margin:0 0 16px;color:var(--muted);font-size:13.5px}
.hero.compact{padding:18px}
.hero.compact h1{font-size:19px}
.hero.compact p{margin-bottom:0}

.btn{
  border:1px solid var(--line);background:var(--card2);color:var(--txt);
  padding:11px 16px;border-radius:12px;font-size:14px;font-weight:650;cursor:pointer;
  transition:transform .06s, filter .15s;
}
.btn:active{transform:scale(.975)}
.btn.acc{background:var(--acc);color:#0b1206;border-color:var(--acc)}
.btn.danger{background:transparent;color:var(--danger);border-color:rgba(255,93,93,.4)}
.btn.ghost{background:transparent}
.btn.big{width:100%;padding:15px;font-size:15.5px;border-radius:14px}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:10px}
.btn.xs{padding:6px 10px;font-size:12px;border-radius:9px}
.btn.rest{background:rgba(77,214,240,.1);border-color:rgba(77,214,240,.35);color:var(--acc2);
  padding:8px 12px;font-size:12.5px;border-radius:10px;font-weight:700;white-space:nowrap}
.btn.focus-btn{background:rgba(139,241,74,.1);border:1px solid rgba(139,241,74,.3);color:var(--acc);padding:6px 10px;border-radius:8px;font-weight:700;font-size:16px;cursor:pointer;}

/* Cabecera de sesión */
.sticky-head{
  position:sticky;top:57px;z-index:30;
  background:rgba(13,17,23,.96);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.head-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.title-sm{font-size:16px;font-weight:750;letter-spacing:-.01em}
.timer{font-size:44px;font-weight:800;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--acc);line-height:1;
  text-shadow: 0 0 20px rgba(139,241,74,0.3); text-align: center; margin: 10px 0;}
.timer.paused{color:var(--warn); text-shadow: 0 0 20px rgba(255,176,32,0.3);}
.progress{height:6px;background:#0a0e14;border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));
  width:0;transition:width .3s ease}

.exname{font-size:15.5px;font-weight:750;letter-spacing:-.01em}
.sets{margin-top:11px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:26px 1fr 1fr 35px 42px;gap:6px;align-items:center;
  background:#11161e;border:1px solid #1f2833;border-radius:10px;padding:6px 7px;transition:.15s}
.set.done{background:rgba(139,241,74,.07);border-color:rgba(139,241,74,.32)}
.setn{color:var(--muted);font-size:12px;font-weight:700;text-align:center}
.inp{width:100%;background:#0c1117;border:1px solid #222c38;color:var(--txt);
  border-radius:8px;padding:8px 9px;font-size:13.5px;font-variant-numeric:tabular-nums;outline:none}
.inp:focus{border-color:var(--acc2)}
.inp::placeholder{color:#4c5a6b}
textarea.inp{font-family:inherit;resize:vertical;min-height:40px}
.check{height:34px;border-radius:9px;border:1px solid #2c3846;background:#0c1117;
  color:#4c5a6b;font-size:16px;font-weight:800;cursor:pointer}
.check.on{background:var(--acc);border-color:var(--acc);color:#0b1206}

/* Dock de descanso */
.restdock{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(15,20,27,.98);backdrop-filter:blur(14px);
  border-top:2px solid var(--acc2);
  box-shadow: 0 -10px 30px rgba(0,0,0,0.6);
}
.restpresets{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);
  padding:9px 14px;border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;
  font-variant-numeric:tabular-nums}
.chip:active{background:var(--acc);color:#0b1206}
.restcount{display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:center}
.restnum{font-size:64px;font-weight:800;color:var(--acc2);font-variant-numeric:tabular-nums;
  text-align:center;line-height:1; text-shadow: 0 0 20px rgba(77,214,240,0.4);}
.restbar{width:100%;max-width:300px;height:8px;background:#0a0e14;border-radius:99px;overflow:hidden}
.restbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));
  width:100%;transition:width .2s linear}
.restactions{display:flex;gap:10px;margin-top:4px}

/* Modales */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,8,12,.72);
  display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.sheet{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 16px;font-size:18px;letter-spacing:-.02em}
.field{margin-bottom:13px}
.field label{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--muted);margin-bottom:6px;font-weight:700}
.field input,.field select{
  width:100%;background:#0c1117;border:1px solid var(--line);color:var(--txt);
  border-radius:11px;padding:12px 13px;font-size:15px;outline:none;
}
.field input:focus,.field select:focus{border-color:var(--acc2)}
.tpl-row{background:#11161e;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;flex-direction:column;gap:8px}
.tpl-row-top{display:grid;grid-template-columns:1fr 32px;gap:6px}
.tpl-row-bot{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
.tpl-row .inp{padding:9px}
.tpl-row .del{background:transparent;border:1px solid #3a2630;color:var(--danger);
  border-radius:8px;cursor:pointer;font-size:15px}

.hist .exname{font-size:14.5px}
.hist .right{text-align:right}
.hist .right .mono{font-size:15px;font-weight:750;color:var(--acc)}

.imc-box{display:flex;align-items:center;gap:16px;background:#0f141c;border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.imc-num{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.imc-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:#1a2330;color:var(--muted);transition:.2s;}
.imc-tag.pos{background:rgba(139,241,74,.12);color:var(--acc)}
.imc-tag.warn{background:rgba(255,176,32,.12);color:var(--warn)}
.imc-tag.danger{background:rgba(255,93,93,.12);color:var(--danger)}

/* ---------------------------------------------------
   VISTA DE ENFOQUE (FOCUS VIEW MODAL)
--------------------------------------------------- */
.focus-modal{
  position:fixed; inset:0; z-index:200; background:rgba(5,8,12,.85);
  display:none; align-items:flex-end; justify-content:center;
  backdrop-filter:blur(8px);
}
.focus-modal.open{ display:flex; }
.focus-sheet{
  width:100%; max-width:560px;
  background:var(--card); border:1px solid var(--line);
  border-radius:24px 24px 0 0;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  animation:up .25s cubic-bezier(0.175, 0.885, 0.32, 1.1);
  box-shadow: 0 -20px 40px rgba(0,0,0,0.8);
}
.focus-header{ text-align:center; margin-bottom:20px; }
.focus-title{ font-size:22px; font-weight:800; letter-spacing:-.02em; margin-bottom:4px;}
.focus-sub{ color:var(--muted); font-size:13px; font-weight:600;}
.focus-timer-container{
  position:relative; width:200px; height:200px; margin:0 auto 24px;
  display:flex; align-items:center; justify-content:center;
}
.focus-timer-text{
  font-size:48px; font-weight:800; font-variant-numeric:tabular-nums;
  color:var(--acc); text-shadow:0 0 20px rgba(139,241,74,.4); z-index:10;
}
.focus-timer-label{
  position:absolute; bottom:30px; font-size:11px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--muted); z-index:10;
}
.focus-circle{ position:absolute; top:0; left:0; width:100%; height:100%; transform:rotate(-90deg);}
.focus-circle circle{ fill:none; stroke-width:8; stroke-linecap:round; }
.focus-circle .bg{ stroke:#1f2833; }
.focus-circle .fg{ stroke:var(--acc); transition:stroke-dashoffset 1s linear;}

.focus-controls{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px;}
.focus-control-box{
  background:#11161e; border:1px solid var(--line); border-radius:16px;
  padding:12px; display:flex; align-items:center; justify-content:space-between;
}
.focus-btn-step{
  width:44px; height:44px; border-radius:50%; background:#1d2531;
  border:none; color:var(--txt); font-size:24px; font-weight:800;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.focus-btn-step:active{ background:var(--acc); color:#000; }
.focus-val{ font-size:28px; font-weight:800; text-align:center; flex:1; font-variant-numeric:tabular-nums;}
.focus-val-lbl{ font-size:11px; color:var(--muted); text-align:center; text-transform:uppercase; font-weight:700; margin-top:-4px;}
.focus-btn-check{
  width:100%; padding:20px; border-radius:16px; background:var(--acc);
  color:#000; font-size:18px; font-weight:800; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.focus-btn-check:active{ transform:scale(.98); }
</style>
</head>
<body>

<header class="topbar">
 <button id="installBtn" style="display:none; background:var(--acc2); color:#000; border:none; padding:6px 10px; border-radius:8px; font-weight:bold; font-size:12px; margin-right:10px;">Instalar App</button>
  <div class="brand">GYM<b>LOG</b> <span>v2.1</span></div>
  <nav>
    <button data-nav="home">Inicio</button>
    <button data-nav="profile">Perfil</button>
    <button data-nav="history">Historial</button>
  </nav>
</header>

<main id="view"></main>
<div id="restDock" class="restdock hidden"></div>
<div id="modal" class="modal"></div>
<div id="focusModal" class="focus-modal"></div>

<script>
"use strict";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const DB = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const fmtClock = ms => {
  const t = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
};
const fmtSecs = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
const fmtShort = s => { const m = Math.floor(s/60), r = s%60; return m ? `${m}'${r ? r+'"' : ""}` : `${r}"`; };
const fmtDate = ts => new Date(ts).toLocaleDateString("es-AR", { weekday:"short", day:"2-digit", month:"short" });
const fmtTime = ts => new Date(ts).toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ============================================================
   IMC
   ============================================================ */
function calcIMC(weightKg, heightCm){
  const w = parseFloat(weightKg), h = parseFloat(heightCm);
  if (!w || !h || w < 20 || w > 400 || h < 100 || h > 250) return null;
  const m = h / 100;
  return w / (m * m);
}
function imcInfo(v){
  if (v == null) return { label:"Sin datos", cls:"" };
  if (v < 18.5)  return { label:"Bajo peso",   cls:"warn"   };
  if (v < 25)    return { label:"Normal",      cls:"pos"    };
  if (v < 30)    return { label:"Sobrepeso",   cls:"warn"   };
  if (v < 35)    return { label:"Obesidad I",  cls:"danger" };
  if (v < 40)    return { label:"Obesidad II", cls:"danger" };
  return { label:"Obesidad III", cls:"danger" };
}

/* ============================================================
   PLANTILLAS POR DEFECTO
   ============================================================ */
const DEFAULT_TEMPLATES = [
  { id:"fullbody", name:"Full Body", exercises:[
    { name:"Sentadilla",            sets:"4", reps:"8-10",  rest:120, tempo:"3-1-2", rir:"2" },
    { name:"Press banca",           sets:"4", reps:"8-10",  rest:120, tempo:"2-0-2", rir:"2" },
    { name:"Remo con barra",        sets:"3", reps:"10-12", rest:90,  tempo:"2-0-1", rir:"1-2" },
    { name:"Press militar",         sets:"3", reps:"10-12", rest:90,  tempo:"2-0-2", rir:"2" },
    { name:"Curl bíceps",           sets:"3", reps:"12",    rest:60,  tempo:"2-0-1", rir:"1" },
    { name:"Plancha",               sets:"3", reps:"40 s",  rest:60,  tempo:"-",     rir:"-" }
  ]},
  { id:"push", name:"Push · Empuje", exercises:[
    { name:"Press banca",           sets:"4", reps:"6-8",   rest:150, tempo:"3-1-1", rir:"1-2" },
    { name:"Press inclinado manc.", sets:"3", reps:"10-12", rest:90,  tempo:"2-0-2", rir:"2" },
    { name:"Aperturas",             sets:"3", reps:"12-15", rest:60,  tempo:"2-0-2", rir:"1" },
    { name:"Press militar",         sets:"3", reps:"8-10",  rest:120, tempo:"2-0-2", rir:"2" },
    { name:"Elevaciones laterales", sets:"3", reps:"15",    rest:60,  tempo:"2-0-1", rir:"1" },
    { name:"Fondos en paralelas",   sets:"3", reps:"10-12", rest:90,  tempo:"2-0-2", rir:"1-2" }
  ]},
  { id:"pull", name:"Pull · Tirón", exercises:[
    { name:"Dominadas",             sets:"4", reps:"6-10",  rest:150, tempo:"2-0-1", rir:"1" },
    { name:"Remo con barra",        sets:"4", reps:"8-10",  rest:120, tempo:"2-0-1", rir:"2" },
    { name:"Jalón al pecho",        sets:"3", reps:"10-12", rest:90,  tempo:"2-0-2", rir:"2" },
    { name:"Face pull",             sets:"3", reps:"15",    rest:60,  tempo:"2-0-2", rir:"1" },
    { name:"Curl bíceps barra",     sets:"3", reps:"10-12", rest:60,  tempo:"2-0-2", rir:"1" },
    { name:"Curl martillo",         sets:"3", reps:"12",    rest:60,  tempo:"2-0-1", rir:"1" }
  ]},
  { id:"legs", name:"Pierna", exercises:[
    { name:"Sentadilla",            sets:"4", reps:"6-8",   rest:150, tempo:"3-1-2", rir:"1-2" },
    { name:"Peso muerto rumano",    sets:"3", reps:"8-10",  rest:120, tempo:"3-1-2", rir:"2" },
    { name:"Prensa",                sets:"3", reps:"10-12", rest:90,  tempo:"2-0-2", rir:"1" },
    { name:"Zancadas",              sets:"3", reps:"12 x pierna", rest:90, tempo:"2-0-2", rir:"2" },
    { name:"Curl femoral",          sets:"3", reps:"12-15", rest:60,  tempo:"2-1-1", rir:"1" },
    { name:"Gemelos",               sets:"4", reps:"15-20", rest:45,  tempo:"2-1-2", rir:"0-1" }
  ]}
];

/* ============================================================
   ESTADO
   ============================================================ */
const state = {
  screen: "home",
  profile:   DB.get("ft_profile", { weight:"", height:"", age:"" }),
  templates: DB.get("ft_templates", DEFAULT_TEMPLATES),
  history:   DB.get("ft_history", []),
  session:   DB.get("ft_session", null),
  timer:     DB.get("ft_timer", { running:false, elapsed:0, startedAt:null }),
  rest:      { endsAt: null, total: 0 },
  focus:     { exIdx: null, setIdx: null } // Estado para la Vista de Enfoque
};

const persist = {
  profile:   () => DB.set("ft_profile", state.profile),
  templates: () => DB.set("ft_templates", state.templates),
  history:   () => DB.set("ft_history", state.history),
  session:   () => DB.set("ft_session", state.session),
  timer:     () => DB.set("ft_timer", state.timer)
};

/* ============================================================
   AUDIO
   ============================================================ */
let actx = null;
function beep(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const now = actx.currentTime;
    [0, 0.28, 0.56].forEach((off, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine";
      o.frequency.value = i === 2 ? 1100 : 880;
      g.gain.setValueAtTime(0.0001, now + off);
      g.gain.exponentialRampToValueAtTime(0.3, now + off + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + off + 0.22);
      o.connect(g).connect(actx.destination);
      o.start(now + off); o.stop(now + off + 0.24);
    });
    if (navigator.vibrate) navigator.vibrate([120, 80, 120, 80, 200]);
  } catch(e){}
}

/* ============================================================
   CRONÓMETROS
   ============================================================ */
function timerElapsed(){
  const t = state.timer;
  return t.elapsed + (t.running ? Date.now() - t.startedAt : 0);
}
function timerToggle(){
  const t = state.timer;
  if (t.running){ t.elapsed = timerElapsed(); t.running = false; t.startedAt = null; }
  else { t.startedAt = Date.now(); t.running = true; }
  persist.timer(); render();
}
function timerReset(){
  state.timer = { running:false, elapsed:0, startedAt:null };
  persist.timer(); render();
}

function restStart(secs){
  state.rest.endsAt = Date.now() + secs * 1000;
  state.rest.total  = secs * 1000;
  renderRestDock();
}
function restAdd(ms){
  if (!state.rest.endsAt) return;
  state.rest.endsAt += ms;
  state.rest.total  += ms;
  renderRestDock();
}
function restStop(){ state.rest.endsAt = null; state.rest.total = 0; renderRestDock(); }

/* ============================================================
   NAVEGACIÓN Y RENDER
   ============================================================ */
function go(screen){ state.screen = screen; render(); window.scrollTo({ top:0, behavior:"smooth" }); }

function render(){
  document.querySelectorAll("[data-nav]").forEach(b =>
    b.classList.toggle("on", b.dataset.nav === state.screen));

  const view = $("#view");
  if (state.screen === "workout" && state.session) view.innerHTML = renderWorkout();
  else if (state.screen === "history")            view.innerHTML = renderHistory();
  else if (state.screen === "profile")            view.innerHTML = renderProfile();
  else                                            view.innerHTML = renderHome();

  renderRestDock();
  updateClockUI();
}
